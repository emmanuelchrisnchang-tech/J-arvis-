<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>J.A.R.V.I.S. — Just A Rather Very Intelligent System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --arc: #00d4ff;
    --arc2: #0088cc;
    --warn: #ff6b00;
    --danger: #ff2244;
    --ok: #00ffaa;
    --dim: #0a1628;
    --panel: rgba(0,212,255,0.04);
    --border: rgba(0,212,255,0.18);
    --text: #c8eeff;
    --muted: rgba(200,238,255,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #020d1a;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridDrift { to { background-position: 40px 40px; } }

  /* Scan line */
  body::after {
    content: '';
